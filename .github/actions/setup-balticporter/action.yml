name: Setup Baltic Porter
description: >-
  Check out the Baltic Porter sources at the commit project/plugins.sbt pins, next to this
  repository. The generator reads its override directories from that checkout; the engine
  ARTIFACTS resolve from Central Snapshots, so nothing is compiled or published here.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        PIN=$(grep -oE 'balticporter-corpus" % "[0-9a-f]{40}' project/plugins.sbt | grep -oE '[0-9a-f]{40}$')
        test -n "$PIN"
        rm -rf ../balticporter
        git init -q ../balticporter
        git -C ../balticporter remote add origin https://github.com/kubuszok/balticporter.git
        git -C ../balticporter fetch -q --depth=1 origin "$PIN"
        git -C ../balticporter checkout -q FETCH_HEAD
        echo "balticporter at $(git -C ../balticporter rev-parse HEAD)"
