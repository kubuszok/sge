name: Generated port
description: >
  The Baltic Porter output (target/balticporter-sge) for this commit, generated ONCE per distinct
  input set and shared between jobs and workflows through the Actions cache — see the action this
  wraps. `generate` needs a full-history checkout and the Scala toolchain; `restore` needs
  neither, and no submodule. sge's own porting policy (sge-port/) and the replacements it reads from sge/src/main/scala are part of the key too.
  The `uses:` line below is the ONE place the shared action's version is pinned.

inputs:
  mode:
    description: generate | restore
    default: restore
  key:
    description: cache key to restore (the `key` output of the `generate` mode); required for `restore`
    default: ""

outputs:
  key:
    description: the cache key the generated tree is stored under
    value: ${{ steps.port.outputs.key }}

runs:
  using: composite
  steps:
    - name: Read the policy inputs the generator reads beyond the submodule
      id: reference
      if: inputs.mode == 'generate'
      shell: bash
      run: |
        set -euo pipefail
        # sge's own porting policy (sge-port/: the ladder, the frozen derived policy, the added members
        # and the files it injects), as the tree git records for it — a change to any file under it
        # generates a new tree. The generator reads no hand-written port from git history any more.
        policy=$(git rev-parse "HEAD:sge-port")
        # the replacements the port reads from sge's own tree (providedSources): their surface decides
        # how the generated code calls them
        provided=$(git rev-parse "HEAD:sge/src/main/scala")
        # the lls base's policy: the lls-port artifact, at the version of the lls dependency
        base=$(grep -oE 'val lls += +"[^"]+' project/Versions.scala | head -1 | sed 's/.*"//')
        test -n "$base"
        # the generated extensions' submodule commits (sge-ecs, sge-noise, …), as ONE digest: the cache
        # key is capped at 512 characters, and a full commit per extension outgrew it
        extensions=""
        for m in $EXTENSION_SUBMODULES; do
          c=$(git ls-tree HEAD "$m" | awk '{print $3}')
          test -n "$c"
          extensions="$extensions$m=$c;"
        done
        extensions=$(printf '%s' "$extensions" | sha256sum | cut -c1-40)
        # the extension generators and the build that wires them: a change to either regenerates
        generators=$(for f in project/BalticPorterExtGen.scala project/BalticPorterEcsGen.scala build.sbt; do git rev-parse "HEAD:$f"; done | sha256sum | cut -c1-16)
        echo "tree=$policy-$provided-$base-$extensions-$generators" >> "$GITHUB_OUTPUT"
      env:
        EXTENSION_SUBMODULES: original-src/ashley original-src/noise4j original-src/anim8-gdx original-src/jbump original-src/guacamole original-src/gdx-vfx original-src/libgdx-screenmanager original-src/colorful-gdx original-src/vis-ui original-src/gdx-ai original-src/regexodus original-src/textratypist

    # Init the generated extensions' submodules alongside libgdx
    - name: Checkout the extension submodules
      if: inputs.mode == 'generate'
      shell: bash
      run: git submodule update --init --depth=1 original-src/ashley original-src/noise4j original-src/anim8-gdx original-src/jbump original-src/guacamole original-src/gdx-vfx original-src/libgdx-screenmanager original-src/colorful-gdx original-src/vis-ui original-src/gdx-ai original-src/regexodus original-src/textratypist

    # The generator runs inside the shared action, which does not retry a download cut off mid-body:
    # load the meta-build (the engine and the pinned snapshot plugins) here first, through the guard
    # that does, so the generation itself finds every jar in the cache
    - name: Fetch the meta-build's dependencies
      if: inputs.mode == 'generate'
      uses: ./.github/actions/sbt-guarded
      with:
        command: sbt about
        require: ""

    - uses: kubuszok/balticporter/.github/actions/generated-port@55be328a2265f34c8d41d30634569229539cf562
      id: port
      with:
        mode: ${{ inputs.mode }}
        key: ${{ inputs.key }}
        path: target/balticporter-sge
        submodule: original-src/libgdx
        key-extra: ${{ steps.reference.outputs.tree }}

    # The ecs tree and reports are generated alongside the core tree by `sbt generatePort`.
    # In `restore` mode the ecs cache must be present (the `generate` job saved it).
    # In `generate` mode with a cache HIT, sbt did not run — restore the ecs cache too.
    # In `generate` mode with a cache MISS, sbt ran and produced the ecs tree — save it.
    - name: Restore the extensions' generated trees
      id: ecs-restore
      if: inputs.mode == 'restore' || inputs.mode == 'generate'
      uses: actions/cache/restore@v4
      with:
        path: |
          target/balticporter-sge-ecs
          target/balticporter-sge-noise
          target/balticporter-sge-anim8
          target/balticporter-sge-jbump
          target/balticporter-sge-guacamole
          target/balticporter-sge-screens
          target/balticporter-sge-vfx
          target/balticporter-sge-tools
          target/balticporter-sge-colorful
          target/balticporter-sge-visui
          target/balticporter-sge-ai
          target/balticporter-sge-regexodus
          target/balticporter-sge-textra
          target/balticporter-reports
        key: ${{ steps.port.outputs.key }}-ecs
        fail-on-cache-miss: ${{ inputs.mode == 'restore' }}
        enableCrossOsArchive: true

    - name: Save the extensions' generated trees
      if: inputs.mode == 'generate' && steps.ecs-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          target/balticporter-sge-ecs
          target/balticporter-sge-noise
          target/balticporter-sge-anim8
          target/balticporter-sge-jbump
          target/balticporter-sge-guacamole
          target/balticporter-sge-screens
          target/balticporter-sge-vfx
          target/balticporter-sge-tools
          target/balticporter-sge-colorful
          target/balticporter-sge-visui
          target/balticporter-sge-ai
          target/balticporter-sge-regexodus
          target/balticporter-sge-textra
          target/balticporter-reports
        key: ${{ steps.port.outputs.key }}-ecs
        enableCrossOsArchive: true
