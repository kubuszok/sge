name: Generated port
description: >
  The Baltic Porter output (target/balticporter-sge) for this commit, generated ONCE per distinct
  input set and shared between jobs and workflows through the Actions cache — see the action this
  wraps. `generate` needs a full-history checkout (the generator derives sge's spellings from the
  hand-written core at ONE pinned commit, which is part of the key) and the Scala toolchain; `restore` needs
  neither, and no submodule. sge's own porting policy (sge-port/) is part of the key too.
  The `uses:` line below is the ONE place the shared action's version is pinned.

inputs:
  mode:
    description: generate | restore
    default: restore
  key:
    description: cache key to restore (the `key` output of the `generate` mode); required for `restore`
    default: ""

outputs:
  key:
    description: the cache key the generated tree is stored under
    value: ${{ steps.port.outputs.key }}

runs:
  using: composite
  steps:
    - name: Read the policy inputs the generator reads beyond the submodule
      id: reference
      if: inputs.mode == 'generate'
      shell: bash
      run: |
        set -euo pipefail
        # sge's own porting policy (sge-port/: the ladder, the frozen derived policy, the added members
        # and the files it injects), as the tree git records for it — a change to any file under it
        # generates a new tree. The generator reads no hand-written port from git history any more.
        policy=$(git rev-parse "HEAD:sge-port")
        # the lls base's policy: the lls-port artifact, at the version of the lls dependency
        base=$(grep -oE 'val lls += +"[^"]+' project/Versions.scala | head -1 | sed 's/.*"//')
        test -n "$base"
        echo "tree=$policy-$base" >> "$GITHUB_OUTPUT"

    - uses: kubuszok/balticporter/.github/actions/generated-port@55be328a2265f34c8d41d30634569229539cf562
      id: port
      with:
        mode: ${{ inputs.mode }}
        key: ${{ inputs.key }}
        path: target/balticporter-sge
        submodule: original-src/libgdx
        key-extra: ${{ steps.reference.outputs.tree }}
