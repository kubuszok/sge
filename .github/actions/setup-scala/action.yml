name: Setup Scala toolchain
description: >
  The ONE definition of the build toolchain: the JDK, sbt and coursier.
  Every job that runs sbt uses this action, so a JDK or sbt bump is a one-line change here.

inputs:
  jvm:
    description: coursier JVM id of the build JDK (Zulu 25 — Panama FFM, every desktop platform incl. Windows aarch64)
    default: "zulu:25.0.3"
  architecture:
    description: >
      force the JDK architecture (x64 on an Apple-silicon runner, arm64 on a Windows-on-ARM runner);
      the JDK then comes from actions/setup-java, which can select one, instead of coursier
    default: ""
  java-version:
    description: JDK major installed when `architecture` is set (keep in step with `jvm`)
    default: "25"
  jdk21:
    description: also install JDK 21 and expose its home (the Robolectric test fork cannot run on JDK 25)
    default: "false"

outputs:
  java21-home:
    description: install path of JDK 21 (empty unless `jdk21` is true)
    value: ${{ steps.jdk21.outputs.path }}

runs:
  using: composite
  steps:
    # Installed FIRST so the build JDK below wins as the final JAVA_HOME.
    - uses: actions/setup-java@v6
      id: jdk21
      if: inputs.jdk21 == 'true'
      with:
        distribution: zulu
        java-version: "21"

    - uses: actions/setup-java@v6
      if: inputs.architecture != ''
      with:
        distribution: zulu
        java-version: ${{ inputs.java-version }}
        architecture: ${{ inputs.architecture }}

    # Deliberately NO dependency cache here (coursier/cache-action, setup-java's `cache: sbt`): each
    # job saves its own 1-2 GB entry, which fills the repository's 10 GB Actions-cache quota within
    # one run and evicts the 12 MB generated-port entry every other job depends on. Resolving from
    # Maven Central on a runner costs far less than those entries do.
    - uses: coursier/setup-action@v3.0.2
      with:
        jvm: ${{ inputs.architecture == '' && inputs.jvm || '' }}
        apps: sbt

    # For an sbt 2 build the `sbt` launcher defaults to a THIN CLIENT that starts a background
    # server. On a runner that is wrong three times over: the server keeps the environment of the
    # step that started it (a publish step's credentials never reach the build), in bash on Windows
    # the client cannot start it at all, and under it the Scala Native test binary on Windows never
    # reported a test. `--server` runs sbt in the foreground, one JVM per call, as before sbt 2.
    # Put a wrapper that adds the flag first on the PATH, so no workflow step can forget it.
    - name: Make `sbt` run in the foreground
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/sbt-foreground"
        mkdir -p "$dir"
        real="$(command -v sbt)"
        printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$real" > "$dir/sbt"
        chmod +x "$dir/sbt"
        if [ "$RUNNER_OS" = "Windows" ]; then
          realbat="$(cygpath -w "$(command -v sbt.bat)")"
          printf '@echo off\r\ncall "%s" --server %%*\r\n' "$realbat" > "$dir/sbt.bat"
          cygpath -w "$dir" >> "$GITHUB_PATH"
        else
          echo "$dir" >> "$GITHUB_PATH"
        fi
