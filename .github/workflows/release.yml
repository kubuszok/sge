name: Sonatype Release

on:
  push:
    branches: [master]
    tags: ["*"]
  # Snapshot publishing on PRs is intentional: it is the organization's mechanism
  # for testing cross-repository artifacts on CI — and what the demos are built against
  # (the `demos` job below). The job-level `if` restricts it to PRs opened by org members so
  # external-fork PRs never publish (and never receive the signing/Sonatype secrets). ISS-484.
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Release gate (ISS-695) ─────────────────────────────────────────
  #
  # A tag can point at ANY commit — including one that never landed on master and therefore never
  # went through ci.yml, which does not run on tags at all. This job re-runs the blocking ci.yml
  # checks (format, covenant gate, JVM tests — the SAME composite actions ci.yml uses) plus an
  # ancestor check, and build-and-publish `needs: [gate]`, so a broken commit turns the release run
  # RED here and publish is SKIPPED. Secrets (GPG / Sonatype) live ONLY in build-and-publish.
  # On pull requests the checks are skipped (ISS-794): ci.yml runs them on the same commit in
  # parallel. They run on master pushes and — the reason this gate exists — on TAG pushes.
  gate:
    name: Validate release commit
    runs-on: ubuntu-latest

    # Same fork-secret guard as build-and-publish (ISS-484). Push events always run.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    env:
      # Hard-fail if JDK 21 is not resolvable, so the JVM leg can never silently degrade to a green
      # run with zero Robolectric tests executed (mirrors ci.yml test-jvm; ISS-485).
      SGE_CI_REQUIRE_JDK21: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # Full history: the ancestor check asks whether the tagged commit is reachable from
          # origin/master, and the generator reads the hand-written core from one pinned commit.
          fetch-depth: 0

      # ANCESTOR CHECK (tag events only): only reviewed, already-CI'd history can be released. On
      # master pushes GITHUB_SHA is already on master; on PRs it is the PR head — both would
      # spuriously fail this check.
      - name: Require tagged commit to be an ancestor of master
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/master — refusing to release an un-merged / un-CI'd commit (ISS-695)"
            exit 1
          fi
          echo "OK: $GITHUB_SHA is an ancestor of origin/master"

      - uses: ./.github/actions/setup-scala
        id: scala
        if: github.event_name != 'pull_request'
        with:
          jdk21: "true"

      # before the first sbt call of the job: the sbt server keeps the environment it started with
      - name: Point the Robolectric test fork at JDK 21
        if: github.event_name != 'pull_request'
        run: echo "JAVA21_HOME=${{ steps.scala.outputs.java21-home }}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/check-format
        if: github.event_name != 'pull_request'

      - uses: ./.github/actions/setup-native-toolchain
        if: github.event_name != 'pull_request'

      - uses: ./.github/actions/covenant-gate
        if: github.event_name != 'pull_request'

      - uses: ./.github/actions/generated-port
        if: github.event_name != 'pull_request'
        with:
          mode: generate

      # One representative leg (JVM) is enough here — the ancestor check guarantees the commit
      # already went through the full ci.yml matrix on master.
      - name: Run JVM tests (core + all extensions)
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/sbt-guarded
        with:
          command: sbt ci-jvm-3

  build-and-publish:
    runs-on: macos-latest

    # Publish only after the gate passes — GitHub skips this job whenever `gate` fails (or is
    # itself skipped), so an unvalidated / broken commit can never reach ci-release. ISS-695.
    needs: [gate]

    # Push events (master / tags) always run. Pull-request events publish a snapshot ONLY when the
    # PR author is an org member/owner/collaborator. ISS-484.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Publish Tag as Release' || 'Publish Snapshot' }}

    env:
      # Snapshots build with the BuildBuddy remote cache (unchanged modules are restored instead of
      # recompiled); a TAGGED release always builds from source.
      BUILDBUDDY_API_KEY: ${{ github.ref_type != 'tag' && secrets.BUILDBUDDY_API_KEY || '' }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      generated-key: ${{ steps.port.outputs.key }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # Baltic Porter derives sge's spellings from the master branch's hand port
          # (`git archive origin/master`); a shallow checkout has no such ref.
          fetch-depth: 0

      - name: Import GPG key for signing the release
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        id: port
        with:
          mode: generate

      - name: Publish all projects
        # sgeValidateNativeLibs checks that the resolved pnm-provider-sge-* dependency carries every
        # binary its manifest promises for all desktop platforms; sbt aborts on the first failure,
        # so a gap blocks ci-release. sbt 2 joins multiple CLI args into ONE command line, so the
        # commands are sequenced with `;` in a single argument.
        # writeDemoVersion pins the root's version into ./.sge-version (ISS-752): sge-build is a
        # SEPARATE build whose version reads that file, so it MUST be written before the sge-build
        # publish step below (otherwise a tagged release would ship a snapshot-versioned plugin).
        run: sbt "sge / sgeValidateNativeLibs; writeDemoVersion; ci-release"
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Publish sbt plugin (sge-build)
        # ISS-752: the sbt plugin every game project needs lives in a SEPARATE sbt build, so the
        # root ci-release never touches it. Same `ci-release` mechanism: on a TAG it stages and
        # releases a signed release; otherwise it publishes a signed snapshot. It reads its version
        # from ../.sge-version, written by writeDemoVersion above.
        working-directory: sge-build
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Report the published version
        id: version
        run: echo "version=$(cat .sge-version)" >> "$GITHUB_OUTPUT"

  # ─── Demos, built against the snapshot just published ───────────────
  #
  # A tagged release is staged, not served from the snapshot repository, so the demos run for
  # snapshots only (the tagged commit's snapshot was already verified on master).
  demos:
    name: Demos (published snapshot)
    needs: [build-and-publish]
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/demos.yml
    with:
      sge-version: ${{ needs.build-and-publish.outputs.version }}
      generated-key: ${{ needs.build-and-publish.outputs.generated-key }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
