name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same PR only (ISS-792): a force-push to a PR
# obsoletes the running validation, but master pushes must QUEUE, not cancel —
# cancelling a running full-matrix master validation leaves master unverified
# (each push would kill the previous push's still-running required legs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ─── Shape of this workflow ─────────────────────────────────────────
#
#   wave 0   plan · format · enforce · sge-build scripted     (need nothing from the generator)
#            generate                                         (the ONLY job that touches the libGDX
#                                                              submodule and runs Baltic Porter)
#   wave 1   compile (jvm | js | native, in parallel)         (every module compiled ONCE, on Linux,
#                                                              into the BuildBuddy remote cache)
#   wave 2   tests, links, integration tests, scaladoc        (restore the generated port, restore
#                                                              compile outputs from the remote
#                                                              cache, then only link and run)
#
# The demos (browser IT, demo smoke/compile, release verification) consume sge as PUBLISHED
# artifacts: release.yml runs them against the snapshot it publishes (demos.yml). Only fork PRs,
# for which nothing is published, run them from here against locally published artifacts.
#
# Every repeated step lives in ONE composite action under .github/actions/:
#   setup-scala · generated-port · setup-js · setup-native-toolchain · setup-gl-xvfb ·
#   sbt-guarded · sge-artifacts
# The build JDK and Node versions are those actions' input defaults — change them there.

env:
  # BuildBuddy remote cache for sbt 2's Bazel-gRPC cache client (ISS-792). Workflow-level so EVERY
  # sbt-running job reads/writes the shared cache. On fork PRs the secret is unavailable, the
  # variable is empty and project/RemoteCacheSetup.scala leaves the remote cache OFF. The cache is
  # namespaced per (ci|dev) × os × arch (RemoteCacheSetup.scala): run 29498350131 showed
  # machine-specific task outputs poisoning other OSes, so only same-OS/arch jobs share entries —
  # the linux-x64 namespace (compile + the whole ubuntu fan-out) is the main win.
  # Deliberately NO actions/cache for ~/.cache/sbt/v2 (docs/reviews/ci-cache-investigation-2026-07-16.md):
  # the remote cache supersedes it. The Actions cache carries only the generated port.
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

jobs:
  # ─── Plan: compute platform matrices per event (ISS-790) ───────────
  #
  # PLATFORM WITHDRAWAL (user decision 2026-07-16, docs/architecture/platform-targets.md):
  # macos-x86_64 (Rosetta) and windows-aarch64 legs are REMOVED from all matrices. Release
  # artifacts for these platforms still ship (untested); revisit once everything else works.
  #
  # The IS_PR filter is currently a no-op, kept as the tiering mechanism (give a row
  # `"tier":"master"` and extend the jq filter to re-introduce master-only legs). Every row carries
  # a `timeout` (minutes, ~2-3x observed duration) so a hung runner fails fast instead of burning
  # the 6h default (see ci-babysitter.yml for the retry).

  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix_jvm: ${{ steps.matrices.outputs.jvm }}
      matrix_native: ${{ steps.matrices.outputs.native }}
      matrix_native_ffi: ${{ steps.matrices.outputs.ffi }}
      # demos run from HERE only when release.yml will not publish a snapshot for this commit:
      # a pull request whose author is not an org member (release.yml's own guard, ISS-484)
      demos_here: ${{ steps.matrices.outputs.demos_here }}
    steps:
      - name: Compute platform matrices
        id: matrices
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          jvm='[
            {"os":"ubuntu-latest","label":"linux-x86_64","platform":"linux-x86_64","timeout":30},
            {"os":"ubuntu-24.04-arm","label":"linux-aarch64","platform":"linux-aarch64","timeout":30},
            {"os":"macos-latest","label":"macos-aarch64","platform":"macos-aarch64","timeout":30},
            {"os":"windows-latest","label":"windows-x86_64","platform":"windows-x86_64","timeout":30}
          ]'
          native='[
            {"os":"ubuntu-latest","label":"linux-x86_64","platform":"linux-x86_64","timeout":45},
            {"os":"ubuntu-24.04-arm","label":"linux-aarch64","platform":"linux-aarch64","timeout":45},
            {"os":"macos-latest","label":"macos-aarch64","platform":"macos-aarch64","timeout":45},
            {"os":"windows-latest","label":"windows-x86_64","platform":"windows-x86_64","timeout":45}
          ]'
          ffi='[
            {"os":"ubuntu-latest","label":"linux-x86_64","timeout":30},
            {"os":"ubuntu-24.04-arm","label":"linux-aarch64","timeout":30},
            {"os":"macos-latest","label":"macos-aarch64","timeout":30},
            {"os":"windows-latest","label":"windows-x86_64","timeout":30}
          ]'
          emit() {
            if [ "$IS_PR" = "true" ]; then
              jq -c 'map(select(.label != "macos-x86_64"))' <<<"$2"
            else
              jq -c . <<<"$2"
            fi | sed "s/^/$1=/" >> "$GITHUB_OUTPUT"
          }
          emit jvm "$jvm"
          emit native "$native"
          emit ffi "$ffi"
          demos_here=false
          if [ "$IS_PR" = "true" ]; then
            case "$AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) demos_here=true ;;
            esac
          fi
          echo "demos_here=$demos_here" >> "$GITHUB_OUTPUT"
          echo "matrices written (PR mode: $IS_PR)"; cat "$GITHUB_OUTPUT"

  # ─── Scalafmt + workflow lint ──────────────────────────────────────

  format:
    name: Scalafmt check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/check-format

      - name: Lint the workflows
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          # workflow structure, expressions, action inputs and `needs` graphs; the shellcheck pass
          # over the run scripts stays off until those scripts have been cleaned against it
          "$RUNNER_TEMP/actionlint" -color -shellcheck=

  # ─── re-scale enforce gate (covenant verify + shortcut budget) ──────
  #
  # BLOCKING (ISS-483). Validates that every file with a `Covenant: full-port` header still passes
  # (no method dropped, no shortcut introduced) and that no new shortcut markers leaked into
  # covenanted files. The gate is a SET-BASED RATCHET: .rescale/scripts/covenant-gate.sh recomputes
  # the live failing set and fails iff any live (file, kind) pair is absent from the committed
  # baseline (.rescale/data/covenant-gate-baseline.tsv). Fixed files are reported as "shrink —
  # update the baseline" but never fail the gate.

  enforce:
    name: re-scale enforce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/setup-native-toolchain

      - uses: ./.github/actions/covenant-gate

  # ─── sge-build plugin unit + scripted tests (ISS-562, ISS-703) ─────
  #
  # sge-build is a separate sbt build: it needs neither the generated port nor the root build.
  # The scripted tests run a fresh hello-world game project against the locally published plugin
  # and assert the packaged output directly (sge-build/src/sbt-test/packaging/*).
  # packaging/android exercises androidSign end-to-end and needs the SDK build-tools.

  test-sge-build-scripted:
    name: sge-build scripted tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/setup-js
        with:
          install-deps: "false"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Publish sge-build plugin to Ivy local
        working-directory: sge-build
        run: sbt publishLocal

      - name: Run sge-build unit tests
        working-directory: sge-build
        run: sbt test

      - name: Run sge-build scripted tests
        working-directory: sge-build
        run: sbt 'scripted packaging/browser packaging/browser-rapier2d packaging/asset-manifest packaging/android'

  # ─── Generate (Baltic Porter) ───────────────────────────────────────
  #
  # The ONLY job that initialises the libGDX submodule and runs the generator, and the only one
  # that needs full history (the generator derives sge's spellings from the hand port on master).
  # The generated tree is stored in the Actions cache under a key made of everything it depends
  # on, so a push that changes none of them skips generation altogether; every other job restores
  # that entry by the key this job outputs.

  generate:
    name: Generate port (Baltic Porter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      key: ${{ steps.port.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        id: port
        with:
          mode: generate

  # ─── Compile (once per platform row) ────────────────────────────────
  #
  # Test/compile of every published module, one job per platform row, on Linux. Two purposes:
  #   1. Fail fast: a compile error reds ONE small job instead of surfacing minutes later inside
  #      every expensive matrix/IT leg.
  #   2. Fill the BuildBuddy remote cache: the downstream jobs restore compile outputs instead of
  #      recompiling. Compiling needs no clang/node — linking and running stay downstream.

  compile:
    name: Compile (${{ matrix.row }})
    needs: [generate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        row: [jvm, js, native]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - name: Test/compile all published modules
        run: sbt 'testCompile-${{ matrix.row }}-3'

  # ─── Scaladoc (published modules) ───────────────────────────────────
  #
  # BLOCKING (ISS-753). Maven Central rejects artifacts without javadoc JARs, so scaladoc must
  # build for every PUBLISHED module (the doc-*-3 aliases cover exactly those).
  # Dotty scaladoc crashes NONDETERMINISTICALLY with "SignatureBuilder.content() is null" (~1 in 3
  # runs, ISS-799). Two defenses: (1) the doc step runs with the REMOTE cache off — sbt 2's action
  # cache can REPLAY a cached doc failure, which would make one crash sticky across runs;
  # (2) one retry with the LOCAL action cache purged, so the second attempt genuinely re-executes.
  # A real doc error fails both attempts, so genuine breakage still gates. The compile outputs
  # scaladoc needs are restored from the remote cache by a separate first step.

  docs:
    name: Scaladoc (published modules)
    needs: [generate, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - name: Restore compile outputs (remote cache on)
        run: sbt 'testCompile-jvm-3; testCompile-js-3; testCompile-native-3'

      - name: Generate scaladoc for all published modules (JVM + JS + Native)
        env:
          SGE_REMOTE_CACHE: "off"
        run: |
          if sbt 'doc-jvm-3; doc-js-3; doc-native-3'; then exit 0; fi
          echo "::warning::scaladoc crashed (ISS-799 nondeterministic dotty NPE class) — purging local action cache and retrying once"
          rm -rf ~/.cache/sbt/v2
          sbt 'doc-jvm-3; doc-js-3; doc-native-3'

  # ─── Scala.js tests (pure Scala, no native dependencies) ────────────

  test-js:
    name: Scala.js tests
    needs: [generate, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - uses: ./.github/actions/setup-js

      - name: Run Scala.js tests (core + all extensions)
        run: sbt test-js-3

  # ─── JVM tests (uses Panama provider JARs) ──────────────────────────

  test-jvm:
    name: JVM tests (${{ matrix.label }})
    needs: [plan, generate, compile]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_jvm) }}
    env:
      # Hard-fail the build if JDK 21 is somehow not resolvable, so the Robolectric module can never
      # silently degrade to a green run with zero tests executed (ISS-485). See build.sbt.
      SGE_CI_REQUIRE_JDK21: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # JDK 21 for the sge-android-robolectric test fork (Robolectric 4.16's ASM cannot run on 25)
      - uses: ./.github/actions/setup-scala
        id: scala
        with:
          jdk21: "true"

      - name: Point the Robolectric test fork at JDK 21
        shell: bash
        run: echo "JAVA21_HOME=${{ steps.scala.outputs.java21-home }}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      # ISS-869: in this MULTI-MODULE run a crash in a later module after an earlier module already
      # printed its summary satisfies the completion check and is caught only by the exit code and
      # the failure marker - documented residual.
      - name: Run JVM tests (core + all extensions)
        uses: ./.github/actions/sbt-guarded
        with:
          command: sbt ci-jvm-3

      - name: Upload coverage to Codecov
        if: always()
        # scoverage does not emit an aggregate report on Scala 3.8.x under sbt 2.0; codecov-action
        # hard-fails when its explicit `files:` are absent even with fail_ci_if_error false.
        # Coverage upload is reporting-only — keep it non-fatal until report generation is restored.
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: target/scala-3.8.4/scoverage-report/scoverage.xml
          flags: ${{ matrix.platform }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Scala Native tests (uses provider JARs from Sonatype) ──────────

  test-native:
    name: Scala Native tests (${{ matrix.label }})
    needs: [plan, generate, compile]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_native) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - uses: ./.github/actions/setup-native-toolchain

      - name: Run Scala Native tests
        run: sbt test-native-3

  # ─── Native FFI IT tests ────────────────────────────────────────────
  #
  # ISS-702: the GLFW+EGL+GLESv2 FFI section must actually execute somewhere — headless skips that
  # whole section, so a broken native GL binding was green on every platform. On linux-x86_64 it
  # runs WITHOUT --headless under xvfb. The validator exits 0 even when the GL section silently
  # skips, so the guard requires "PASS  glfwTerminate", the section's final check. linux-aarch64,
  # macOS and Windows stay headless (no proven display setup on those runners).

  test-native-ffi-it:
    name: Native FFI IT tests (${{ matrix.label }})
    needs: [plan, generate, compile]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_native_ffi) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - uses: ./.github/actions/setup-native-toolchain

      - uses: ./.github/actions/setup-gl-xvfb
        if: matrix.label == 'linux-x86_64'

      - name: Run native FFI validation (under xvfb)
        if: matrix.label == 'linux-x86_64'
        uses: ./.github/actions/sbt-guarded
        with:
          command: xvfb-run -a --server-args="-screen 0 1280x1024x24" sbt 'sge-it-native-ffi/run'
          require: "PASS  glfwTerminate"

      - name: Run native FFI validation (headless)
        if: matrix.label != 'linux-x86_64'
        run: sbt 'sge-it-native-ffi/run -- --headless'

  # ─── Native app runtime (execute a Scala Native binary) ────────────
  #
  # ISS-560: prove app-level Scala Native runtime, not just nativeLink. Links the RegressionApp
  # native binary and EXECUTES it headless (Sge lifecycle -> file/asset FFI -> render loop -> clean
  # exit), asserting SMOKE_TEST_PASSED and exit 0.

  test-native-runtime:
    name: Native runtime (linux-x86_64)
    needs: [generate, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - uses: ./.github/actions/setup-native-toolchain

      - name: Link + execute RegressionApp native binary (headless)
        run: |
          set -euo pipefail
          sbt 'regressionTestNative/nativeLink'
          BIN=$(find target/out/native0.5 -maxdepth 3 -type f -name 'sge-test-regression' | head -1)
          echo "native binary: $BIN"
          test -x "$BIN" || { echo "native binary not found or not executable"; exit 1; }
          BINDIR=$(dirname "$BIN")
          set +e
          ( cd "$BINDIR" && LD_LIBRARY_PATH="$BINDIR:${LD_LIBRARY_PATH:-}" ./sge-test-regression --headless ) 2>&1 | tee /tmp/native-run.log
          RC=${PIPESTATUS[0]}
          set -e
          grep -q 'SMOKE_TEST_PASSED' /tmp/native-run.log || { echo "FAIL: SMOKE_TEST_PASSED not in output"; exit 1; }
          test "$RC" -eq 0 || { echo "FAIL: native binary exited $RC"; exit 1; }
          echo "OK: native RegressionApp ran headless, SMOKE_TEST_PASSED, exit 0"

  # ─── Gauntlet (headless feature probes, ISS-766) ───────────────────
  #
  # Non-GPU probes (files, assets, json/xml, net loopback, jbump, ai fsm, audio lifecycle) execute
  # and must pass; requiresGpu probes are reported as skipped_gpu. Exit code = hard failures.

  gauntlet-headless:
    name: Gauntlet (headless probes)
    needs: [generate, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - name: Run gauntlet (headless)
        run: sbt "sge-gauntlet/run --headless --report ${{ github.workspace }}/target/gauntlet"

      - name: Print gauntlet summary
        if: always()
        run: cat target/gauntlet/report.md || true

      - name: Upload gauntlet report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gauntlet-report
          path: target/gauntlet
          if-no-files-found: warn

  # ─── Desktop IT tests (GLFW + native libs) ─────────────────────────
  #
  # GLFW windowing + ANGLE GLES need a display and X11/GL runtime libs; xvfb provides the display
  # and ANGLE runs on its default GL-over-llvmpipe backend. ANGLE's Vulkan backend was ruled out:
  # device init fails identically on mesa lavapipe AND Chrome's SwiftShader ("Internal Vulkan error
  # -3", vk_renderer.cpp:2318), so ISS-538 clause 2 (cross-window context sharing) cannot pass here
  # (honest 6/7). The suite writes a completion sentinel in afterAll; its absence means the forked
  # JVM crashed mid-run.

  test-desktop-it:
    name: Desktop IT tests
    needs: [generate, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SGE_IT_SENTINEL: ${{ github.workspace }}/target/desktop-it-sentinel
      # Hard-fail (do not assume-skip) if the display or native libs are unavailable — this job must
      # never silently return to zero executed checks (requireOrAssume, ISS-485).
      SGE_CI_REQUIRE_DISPLAY: "1"
      # Force software rendering so ANGLE/GLFW get a usable GL context with no GPU on the runner.
      LIBGL_ALWAYS_SOFTWARE: "true"
      GALLIUM_DRIVER: "llvmpipe"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - uses: ./.github/actions/setup-gl-xvfb

      - name: Run Desktop integration tests (under xvfb)
        uses: ./.github/actions/sbt-guarded
        with:
          command: xvfb-run -a --server-args="-screen 0 1280x1024x24" sbt 'sge-it-desktop/testFull'
          require: ""
          sentinel: ${{ github.workspace }}/target/desktop-it-sentinel

  # ─── JVM Platform IT tests (Panama, Android ops) ───────────────────

  test-jvm-platform-it:
    name: JVM Platform IT tests
    needs: [generate, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Hard-fail (do not assume-skip) if the native libs are not resolvable from the provider JAR —
      # this job must never silently return to zero executed FFI checks (ISS-697).
      SGE_CI_REQUIRE_PANAMA: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - name: Run JVM Platform integration tests
        uses: ./.github/actions/sbt-guarded
        with:
          command: sbt 'sge-it-jvm-platform/testFull'

  # ─── Android IT tests (emulator) ───────────────────────────────────
  #
  # Builds the smoke APK and runs the real smoke IT in its own emulator (ISS-698).

  test-android-it:
    name: Android IT tests
    needs: [generate, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - uses: ./.github/actions/sge-artifacts
        with:
          platforms: jvm
          extensions: "false"

      - name: Build smoke APK
        run: sbt 'sge-android-smoke/androidSign'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          # The smoke APK is rebuilt INSIDE the emulator-runner environment right before the IT (the
          # separate step above runs in a context the test could not see the artifact from).
          # Each script LINE runs separately via `sh -c` (dash - no PIPESTATUS), so the guard of
          # the sbt-guarded action is spelled out here: (a) sbt's exit code through an explicit
          # `bash -ec`, (b) the munit summary line (crash => no summary), (c) no failure marker.
          script: |
            echo "ANDROID-IT cwd=$(pwd) HOME=$HOME"
            sbt 'sge-android-smoke/androidSign'
            echo "=== .apk files produced ==="; find "$(pwd)" -name '*.apk' 2>/dev/null; find "$HOME" -name 'app-debug.apk' 2>/dev/null | head
            bash -ec 'sbt "sge-it-android/testFull" 2>&1 | tee /tmp/android-it.log; exit ${PIPESTATUS[0]}'
            grep -qE 'Passed: Total [1-9]' /tmp/android-it.log || { echo '::error::munit summary missing - the forked test JVM died uncleanly (crash), not a clean fail'; exit 1; }
            ! grep -qE '==> X ' /tmp/android-it.log || { echo '::error::munit failure marker present in output (failures cannot hide behind exit 0)'; exit 1; }

  # ─── Demos, for commits release.yml publishes no snapshot for ───────

  demos:
    name: Demos (locally published)
    needs: [plan, generate, compile]
    if: needs.plan.outputs.demos_here == 'true'
    uses: ./.github/workflows/demos.yml
    with:
      generated-key: ${{ needs.generate.outputs.key }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
