# ISS-792 phase 0 — DISPOSABLE remote-cache spike. Not part of CI proper.
#
# Answers the investigation doc's spike questions (docs/reviews/
# ci-cache-investigation-2026-07-16.md) with sbt 2's Bazel-gRPC remote cache
# against BuildBuddy instead of actions/cache:
#   1. Real hit-rates on GH runners: job A seeds the cache, job B (fresh
#      ubuntu runner, empty disk cache) recompiles and counts zinc
#      "compiling" lines — expect ~0 if remote hits work.
#   2. Cross-OS: ANSWERED by run 29498350131 — cross-OS hits DID happen and
#      POISONED consumers (machine-specific outputs, e.g. discovered clang
#      paths, virtualized onto the wrong OS). The cache is now namespaced per
#      (ci|dev) × os × arch (RemoteCacheSetup.scala), so job C's role flipped:
#      it verifies ISOLATION — a fresh macos-aarch64 runner must NOT hit
#      linux-seeded entries. Its count is informational (full recompile
#      expected on the first dispatch; later dispatches may legitimately hit
#      macos-aarch64-namespace seeds from previous spike runs).
#   3. Nondeterministic misses: any nonzero count in B is itemized in the
#      step summary for comparison against the local findings (Test-scope
#      row misses; Compile-scope hits proven stable).
#
# Requires the BUILDBUDDY_API_KEY org secret; jobs fail loudly if absent
# (an empty key silently disables the cache and would fake a 100% miss).
# Delete this workflow once ISS-792 phase 0 evidence is collected.

name: CI cache spike (ISS-792)

on:
  workflow_dispatch:

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "zulu"
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

jobs:
  seed:
    name: "Job A: seed remote cache (ubuntu)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Require BUILDBUDDY_API_KEY
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is empty — the remote cache would silently stay OFF and the spike would measure nothing. Configure the org secret and re-dispatch."
            exit 1
          fi

      - name: Compile all rows (seed)
        run: |
          set -euo pipefail
          start=$(date +%s)
          sbt 'testCompile-jvm-3; testCompile-js-3; testCompile-native-3' 2>&1 | tee /tmp/spike-a.log
          rc=${PIPESTATUS[0]}
          end=$(date +%s)
          n=$(grep -c '\[info\] compiling ' /tmp/spike-a.log || true)
          echo "SPIKE: jobA compile $((end - start))s, $n module compilations (cold seed)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  hit-same-os:
    name: "Job B: fresh ubuntu runner (expect remote hits)"
    needs: [seed]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Require BUILDBUDDY_API_KEY
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is empty — cannot measure remote hits."
            exit 1
          fi

      - name: Compile all rows (fresh runner, warm remote)
        run: |
          set -euo pipefail
          start=$(date +%s)
          sbt 'testCompile-jvm-3; testCompile-js-3; testCompile-native-3' 2>&1 | tee /tmp/spike-b.log
          rc=${PIPESTATUS[0]}
          end=$(date +%s)
          [ "$rc" -eq 0 ] || { echo "::error::compile itself failed (rc=$rc)"; exit "$rc"; }
          n=$(grep -c '\[info\] compiling ' /tmp/spike-b.log || true)
          echo "SPIKE: jobB compile $((end - start))s, $n module compilations (expect ~0)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "modules that recompiled (remote-cache misses):" | tee -a "$GITHUB_STEP_SUMMARY"
            grep '\[info\] compiling ' /tmp/spike-b.log | sed 's/^/  /' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::SPIKE: $n compile invocations on a warm remote cache — same-OS remote hits are incomplete (see summary)"
            exit 1
          fi
          echo "SPIKE: jobB — full remote-cache hit on same OS" | tee -a "$GITHUB_STEP_SUMMARY"

  hit-cross-os:
    name: "Job C: fresh macos-aarch64 runner (namespace-isolation probe)"
    needs: [seed]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Require BUILDBUDDY_API_KEY
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is empty — cannot measure remote hits."
            exit 1
          fi

      - name: Compile all rows (fresh macOS runner, isolated namespace)
        run: |
          set -euo pipefail
          start=$(date +%s)
          sbt 'testCompile-jvm-3; testCompile-js-3; testCompile-native-3' 2>&1 | tee /tmp/spike-c.log
          rc=${PIPESTATUS[0]}
          end=$(date +%s)
          [ "$rc" -eq 0 ] || { echo "::error::compile itself failed (rc=$rc)"; exit "$rc"; }
          n=$(grep -c '\[info\] compiling ' /tmp/spike-c.log || true)
          # Cross-OS sharing is deliberately impossible now (per-os/arch
          # instance namespace — see RemoteCacheSetup.scala). On the FIRST
          # dispatch after a commit this job should recompile everything
          # (isolation working); ~0 compilations here can only mean either a
          # previous dispatch already seeded the macos-aarch64 namespace at
          # this commit, or namespace bleed. Informational — no hard assert.
          echo "SPIKE: jobC (macos-aarch64, own namespace) compile $((end - start))s, $n module compilations (full recompile expected on first dispatch — isolation check)" | tee -a "$GITHUB_STEP_SUMMARY"
