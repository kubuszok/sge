# Scala compiler/stdlib versions are managed BY HAND: Scala is bumped manually, not by Steward.
# A version pin (updates.pin) does not hold: Steward unifies Scala up to the newest Scala 3 version.
# Ignoring single artifacts leaks platform-suffixed ones such as scala3-library_sjs1_3.
# Ignoring the whole org.scala-lang group is the only reliable block.
# The com.kubuszok snapshots below (multiarch, lls, Baltic Porter, native providers) are pinned
# by hand to a commit sge has been verified against; Steward would propose unverified snapshots.
updates.ignore = [
  { groupId = "org.scala-lang" },
  { groupId = "com.kubuszok", artifactId = "sbt-multiarch-scala" },
  { groupId = "com.kubuszok", artifactId = "multiarch-core" },
  { groupId = "com.kubuszok", artifactId = "multiarch-panama-api" },
  { groupId = "com.kubuszok", artifactId = "multiarch-panama-jdk" },
  { groupId = "com.kubuszok", artifactId = "multiarch-resources" },
  { groupId = "com.kubuszok", artifactId = "lls" },
  { groupId = "com.kubuszok", artifactId = "balticporter-engine" },
  { groupId = "com.kubuszok", artifactId = "sn-provider-sge" },
  { groupId = "com.kubuszok", artifactId = "sn-provider-sge-freetype" },
  { groupId = "com.kubuszok", artifactId = "sn-provider-sge-physics" },
  { groupId = "com.kubuszok", artifactId = "sn-provider-sge-physics3d" },
  { groupId = "com.kubuszok", artifactId = "pnm-provider-sge-desktop" },
  { groupId = "com.kubuszok", artifactId = "pnm-provider-sge-freetype-desktop" },
  { groupId = "com.kubuszok", artifactId = "pnm-provider-sge-physics-desktop" },
  { groupId = "com.kubuszok", artifactId = "pnm-provider-sge-physics3d-desktop" }
]
pullRequests.grouping = [
  { name = "scala-versions", title = "Scala compiler updates", filter = [{ group = "org.scala-lang" }, { group = "org.scoverage" }] }
]
