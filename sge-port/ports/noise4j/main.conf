# -------------------------------------------------------------------------------------------
# noise4j — `src`, 12 types, a dependency-free procedural map-generation library (Apache-2.0).
#
# A standalone BASE port, the same shape as simple-graphs: nothing is merely resolved against,
# everything is converted, and the whole policy is data. Paths are relative to THIS FILE (see
# `balticporter.runner.PortConfig`).
#
# WHAT THIS LIBRARY IS IN THE CORPUS FOR. It is 2,491 lines and it is the corpus's first
# concentration of Java ENUM CONSTANT BODIES — three of them (`Generator.GenerationMode`,
# `RoomType.DefaultRoomType`, `DungeonGenerator.Direction`), each an abstract enum whose constants
# override a method. libGDX, Ashley and simple-graphs between them have none. It also carries the
# interface-constant shape (`Grid.CellConsumer.BREAK`/`CONTINUE`, read UNQUALIFIED from an
# implementing class), a `continue` inside a nested loop, and `java.util` mutation through an
# `Iterator.remove()`.
#
# NO `collections` PHASE, and that is a decision rather than an omission. The reference hand port
# (`../sge/sge-extension/noise`) keeps `java.util.{ArrayList, HashMap, HashSet, LinkedList,
# Iterator, Set}` verbatim — it imports them and renames only to dodge Scala's own `Iterator`/`Set`.
# CLAUDE.md §3.5: where the reference solved it, that is the answer. Retyping onto
# `scala.collection.mutable` would have to reproduce `Iterator.remove()` and `List.set` returning
# the previous element, neither of which a Scala collection has, and this port has no reason to pay
# for it.
# -------------------------------------------------------------------------------------------

label = "sge-noise"

input {
  # A BASE port: nothing is merely resolved against, everything is converted.
  sourceRoot = "../../../../../sge/original-src/noise4j/src"

  # noise4j declares NO dependencies (`build.gradle` has an empty `dependencies` block) and imports
  # nothing outside `java.lang`, `java.math` and `java.util`, so there is no frontend classpath to
  # supply. Verified by `grep -h '^import' src` over all 12 files, not assumed from the build file.
}

output {
  portRoot  = "../../../../ported/sge-noise"
  sourceSet = "main"
}

# noise4j's policy. A BASE manifest — it has no bases of its own.
manifest {
  name    = "sge-noise"
  governs = ["com.github.czyzby.noise4j"]

  # `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must run
  # after every other phase, because all of their policy is written in the upstream namespace, and
  # `runsAfter` cannot state "after everything". `PortRun` appends it last and verifies it.
  #
  # The reference hand-port's target namespace, and it is NOT a single prefix: noise4j splits its 12
  # types across `…noise4j.array` and `…noise4j.map`, and the hand port COLLAPSES both onto
  # `sge.noise` (`Grid` and `Int2dArray` are siblings there). Two entries rather than one, and the
  # phase is longest-prefix-wins, so `…noise4j.map.generator` follows the `.map` entry to
  # `sge.noise.generator` with nothing said about it — which is exactly where the hand port puts it.
  packageRenames {
    "com.github.czyzby.noise4j.map"   = "sge.noise"
    "com.github.czyzby.noise4j.array" = "sge.noise"
  }

  surface = [
    # `DungeonGenerator.normalizeSize(int size)` reassigns its own parameter (`--size` / `++size`
    # returned as a value). Java parameters are variables and Scala's are not; this is the phase
    # that gives such a parameter a local `var`.
    { transform = "mutable-params" },
  ]

  # The reference hand port for sge-noise. The hand-written noise4j port lives in sge's extension
  # tree. Not inherited: comparing against a hand port is per-library policy, and empty policy is a
  # no-op.
  parity { roots = ["../../../../../sge/sge-extension/noise/src/main/scala"] }
}

provenance {
  upstreamName     = "noise4j"
  originalLicense  = "Apache-2.0"
  sourcePathPrefix = "src"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale.
}

# A single source set compiled standalone by `scala-cli`, with no test set beside it (noise4j ships
# no tests), so any support type a phase retypes onto must ship here.
runtimeMode = "vendored"

nextStep = "just noise4j-measure"
