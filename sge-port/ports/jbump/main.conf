# -------------------------------------------------------------------------------------------
# jbump — `jbump/src`, 19 types, a dependency-free 2D AABB collision library (a Java port of
# kikito's `bump.lua`). Apache-2.0.
#
# A standalone BASE port, the same shape as simple-graphs: no resolution roots, everything
# converted, one source set compiled by `scala-cli`.
#
# WHY jbump is worth adding to the corpus — what it exercises that nothing before it does:
#
#   1. **A class that is BOTH `Iterable<T>` and `Iterator<T>`** (`IntIntMap.Entries`), reached
#      through a class that is only `Iterable` (`IntIntMap`). CLAUDE.md §4.5 territory, and the
#      first time it appears in a library that is not libGDX — `IntIntMap` is in fact libGDX's own
#      class, vendored into jbump, which is what makes it the control experiment for whether the
#      shared-iterator problem is a library-specific (CLAUDE.md §1(c)) rule or something more general.
#   2. **Java interface CONSTANTS that are anonymous classes.** `CollisionFilter.defaultFilter`,
#      `Response.slide|touch|cross|bounce` — five of them, and `World.check` instantiates a
#      `CollisionFilter` whose body calls `defaultFilter` UNQUALIFIED, i.e. through the inherited
#      static. Java interface constants are static and inherited; Scala companions are not.
#   3. **A field and a method of the same name, three times over**: `Collisions.size` /
#      `Collisions.size()`, `IntIntMap.Entries.hasNext` / `hasNext()`, `MathUtils.random` /
#      `random(int)`. CLAUDE.md §4.55, on a library small enough to read the whole result.
#   4. **`size++` read as a value** — `if (size++ >= threshold) resize(...)`, eight times in
#      `IntIntMap`. CLAUDE.md §4.4's post-increment row, in the one place it decides correctness.
#
# Paths are relative to THIS FILE (see `balticporter.runner.PortConfig`).
# -------------------------------------------------------------------------------------------

label = "sge-jbump"

input {
  # A BASE port: nothing is merely resolved against, everything is converted.
  #
  # NOT included: `test/src`. Upstream's `test` gradle module is a runnable libGDX demo
  # (`TestBump extends ApplicationAdapter`, LWJGL3 + shapedrawer, `project.ext.mainClassName`), not
  # a suite — it declares zero `@Test` methods, which `just jbump-measure` re-derives on every run
  # rather than taking on trust. Porting it would mean porting libGDX's backends and a third-party
  # drawing library to run a window.
  sourceRoot = "../../../../../sge/original-src/jbump/jbump/src"
}

output {
  portRoot  = "../../../../ported/sge-jbump"
  sourceSet = "main"
}

manifest {
  name    = "sge-jbump"
  governs = ["com.dongbat.jbump"]

  # The reference hand-port's target namespace (`../sge/sge-extension/jbump`, `package sge; package
  # jbump`). `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must
  # run after every other phase, because all of their policy is written in the upstream namespace.
  packageRenames { "com.dongbat.jbump" = "sge.jbump" }

  surface = [
    { transform = "collections" },
    { transform = "mutable-params" },
  ]

  # The reference hand port for sge-jbump. The hand-written jbump port lives in sge's extension
  # tree. Not inherited: comparing against a hand port is per-library policy, and empty policy is a
  # no-op.
  parity { roots = ["../../../../../sge/sge-extension/jbump/src/main/scala"] }
}

# Apache-2.0, stated by both the repository `LICENSE` (the full 201-line Apache text) and every
# file header ("Licensed under the Apache License, Version 2.0"). Note the reference hand port's
# headers say "Licensed under the MIT License" — the same discrepancy simple-graphs has in the
# other direction, and resolved the same way: a port is a derived work, so the UPSTREAM file is the
# authority.
provenance {
  upstreamName     = "jbump"
  originalLicense  = "Apache-2.0"
  sourcePathPrefix = "jbump/src"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale.
}

# A single source set compiled standalone by `scala-cli`: the support types the collections phase
# retypes onto ship beside the emitted code.
runtimeMode = "vendored"

nextStep = "just jbump-measure"
