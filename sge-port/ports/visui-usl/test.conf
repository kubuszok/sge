# -------------------------------------------------------------------------------------------
# USL's own JUnit suite (`usl/src/test/java`) — 2 files, 7 `@Test`, and SEVEN OF THE CHECKOUT'S
# NINE. VisUI declares 9 real `@Test` in total; two are in `ui/` and the rest are here, so the
# module the sibling port deferred holds three quarters of the library's behavioural evidence.
#
# A DEPENDENT of `main.conf`: it resolves against `usl/src/main/java`, never against the Scala that
# port emitted, so it INHERITS the base's rename and surface phases through `base` below rather
# than restating them (CLAUDE.md §1.5). `base` contributes the MANIFEST and nothing else;
# everything under `input`, `output`, `provenance` and `runtimeMode` here is a fact about THIS
# source set's build and is deliberately its own.
#
# ==WHY THIS SUITE IS THE BEST-SHAPED ONE IN THE CORPUS==
# All six live tests are one private method called with two arguments: parse a `.usl` resource,
# compare the resulting JSON against an `-expected.json` resource checked in beside it. Upstream
# wrote BOTH sides. So every assertion is an end-to-end run of the lexer, the parser, the style
# merger and the JSON writer together, compared LINE BY LINE — which is exactly the instrument
# §4.4's silent forms need. 28 post-increment sites live in these lexer/parser sources, and a
# post-increment read as a value moves no compile-error count and produces slightly wrong output.
# -------------------------------------------------------------------------------------------

label = "sge-visui-usl-test"
base  = "main.conf"

input {
  sourceRoot = "../../../../../sge/original-src/vis-ui/usl/src/test/java"

  # JUnit must be on the FRONTEND's classpath. `import org.junit.Assert` that the frontend cannot
  # resolve does not fail — it resolves WRONGLY, to an unqualified call on the enclosing test
  # class, and emits as `this.assertEquals(...)`. Recorded three times already (libGDX's
  # `org.junit.Assert.*`, Ashley's `org.mockito.Mockito.*`, simple-graphs'); this port would have
  # made it four.
  #
  # The file is written by `UslTestClasspath`, which fetches exactly what the build DECLARES —
  # `usl/build.gradle`'s `testImplementation "junit:junit:$junitVersion"` against the root
  # `build.gradle`'s `junitVersion = '4.13.2'`, not a current one.
  classpathFile = "../../../../out/usl-test-classpath.txt"

  resolutionRoots = ["../../../../../sge/original-src/vis-ui/usl/src/main/java"]
}

output {
  portRoot  = "../../../../ported/sge-visui-usl"
  sourceSet = "test"
}

manifest {
  name = "sge-visui-usl-test"

  # ONE entry, and NOT a second `governs`/`packageRenames` pair: both are inherited from the base
  # through `base` above, which is the whole point of §1.5. A test source set declares its suites
  # INSIDE the library's own namespace (`com.kotcrab.vis.usl.test` is a sub-package of
  # `com.kotcrab.vis.usl`), so the base's one rename pair carries this tree too.
  surface = [ { transform = "test-framework" } ]
}

provenance {
  upstreamName     = "USL"
  originalLicense  = "Apache-2.0"
  sourcePathPrefix = "vis-ui/usl/src/test/java"
}

# NOT `vendored`, unlike the main port: that source set is compiled beside this one and already
# carries the shims. Vendoring again would define every support type twice — which the JVM
# tolerates only while the copies agree, and the Scala.js/Native linkers reject.
runtimeMode = "dependency"

nextStep = "just usl-test-measure"
