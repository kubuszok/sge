# -------------------------------------------------------------------------------------------
# USL — VisUI's skin-definition language compiler. `usl/src/main/java`, 18 files / 1,604 LOC:
# a lexer, a recursive parser, a style merger and a JSON writer. Apache-2.0.
#
# A STANDALONE BASE port with NO base and NO resolution roots — the same shape as jbump and
# noise4j, and deliberately NOT a dependent of `sge-visui`.
#
# ============================================================================================
# WHY THIS IS ITS OWN PORT ROOT AND NOT A SCOPE EDIT TO `sge-visui` (CLAUDE.md §1.5, §2.1)
# ============================================================================================
# CLAUDE.md §1.5 is explicit that an upstream splitting ONE library across N maven modules is ONE port
# whose scope is a list of globs, and that a port root per upstream module is "N names for a
# module the reference build does not have". That rule does not reach this pair, and the test it
# gives is the one that says so: it is about modules that "all … declare under one package
# root". These do not. `com.kotcrab.vis.ui` and `com.kotcrab.vis.usl` are SIBLINGS — neither is a
# prefix of the other — and upstream publishes them as two maven coordinates at two INDEPENDENT
# versions (`vis-ui` 1.5.9-SNAPSHOT against `vis-usl` 0.2.2-SNAPSHOT, in two `gradle.properties`).
# Two artifacts that share a git repository are not one library split across modules.
#
# Four further facts, each of which alone settles it:
#
#   1. **THE DECISION IS ALREADY IN THE CODE.** `VisUiPolicy.governs` was NARROWED to
#      `com.kotcrab.vis.ui` — rather than the organisation namespace `com.kotcrab.vis`, which
#      would have covered this tree — with the stated reason that "the USL follow-up is exactly
#      such a sibling … so the claim is the sub-namespace this run converts and the follow-up
#      states its own". A scope edit into that run is the one outcome that narrowing forecloses.
#
#   2. **THE DEPENDENCY DIRECTION.** `sge-visui` is a DEPENDENT of libGDX core and inherits
#      libGDX's twelve surface phases through `LibgdxPolicy.core`. USL imports no libGDX — it
#      imports NOTHING outside the JDK, re-derived by the lane on every run — so merged, the USL
#      compiler could not be built without libGDX core and 162 scene2d widget classes on the
#      classpath. That is a build-time tool requiring a rendering engine. It would also inherit
#      `collections`, `nullability`, `mutable-params` and `bean-properties` as facts about
#      libGDX's shared SURFACE, when what USL's collections should become is a decision USL is
#      entitled to make on its own evidence — and this library's output is ORDER-SENSITIVE JSON
#      compared LINE BY LINE against a checked-in artifact (see the oracle below), which is the
#      one place a retyping inherited for someone else's reasons could not be read off a count.
#
#   3. **THE EMISSION SLOTS.** A run's emission identity is (`portRoot`, `sourceSet`) and
#      `PortRun` opens with an unconditional wipe, so one destination module has exactly TWO
#      slots. `sge-visui` already spends `main` on `ui/`; its `test` slot is reserved for the 2
#      upstream `ui/` `@Test` that this port's own tracker still holds open. USL brings 18
#      main files AND 7 `@Test` of its own, which is a third and a fourth tree.
#
#   4. **STANDALONE IS HONEST HERE, NOT A SHORTCUT.** CLAUDE.md §1.5 makes a run whose resolution roots lie
#      outside its own source root — the structural signature of a dependent — with no base
#      declared a FATAL finding. This run has NO resolution roots at all, because USL resolves
#      against nothing, so the signature does not arise. Declaring `base = "sge-visui"` would
#      claim a shared surface that exists in NEITHER direction: `ui/` references no
#      `com.kotcrab.vis.usl` type and `usl/` references no `com.kotcrab.vis.ui` one, both
#      re-derived by the lane.
#
# CLAUDE.md §2.1's question — a port is named for its DESTINATION — is genuinely OPEN here and is answered
# by the same fact rather than dodged: the reference hand port (`../sge/sge-extension/visui`)
# NEVER PORTED USL, so there is no destination spelling to match. The name follows the reference
# build's own convention for a visui sibling (`build.sbt`'s `sge-visui`, artifact
# `sge-extension-visui`), and it names a destination the consumer can actually use — a tool
# artifact a build depends on, beside the widget library it depends on at runtime.
#
# ============================================================================================
# WHY USL IS WORTH PORTING — the corpus's first chance to EXCEED the reference port
# ============================================================================================
# Every other library in this corpus is measured against a hand port that already exists. USL has
# none: the reference port skipped it entirely, so anything this engine emits here is a
# capability sge does not have. CLAUDE.md §3.5 is explicit that a skip is not a model — "this
# project exists precisely to port what sge left out" — and this is the first time that sentence
# has a whole module behind it.
#
# What it exercises that no other corpus member does:
#
#   1. **A HAND-WRITTEN CHARACTER SCANNER.** `Lexer` (293 LOC) and `Parser` (307 LOC) are
#      ordinary imperative java driven by a `char` index — no generator, no grammar file, no
#      reflection. This is emphatically NOT liqp's situation, where two ANTLR `.g4` files
#      generate java the frontend cannot read. The risk here is BEHAVIOURAL fidelity of a
#      state-machine scan. CLAUDE.md §4.4's post-increment row is the obvious thing to fear, since
#      there are **28 post-increment/decrement sites** — and the fear was MEASURED and does not
#      hold: ALL 28 are in STATEMENT position, and not one increment in these files is read as a
#      VALUE (grepped for `= i++`, `(i++)`, `[i++]`, `return i++` and the pre-increment spellings;
#      0). A statement-position `i++` renders `i = i + 1` and has no before-or-after question in
#      it, so this port is evidence about that row in NEITHER direction. This port's own tracker
#      states what its oracle IS evidence about, which is the rest of the scanner.
#
#   2. **A ZERO-AUTHORING CONFORMANCE ORACLE.** Upstream ships BOTH sides of the answer and
#      nobody here writes a test to use them. See `test.conf` and the lane; the numbers are in
#      this port's own tracker.
#
# Paths are relative to THIS FILE (see `balticporter.runner.PortConfig`).
# -------------------------------------------------------------------------------------------

label = "sge-visui-usl"

input {
  # NO `resolutionRoots` and NO `classpathFile`, and both absences are re-derived by the lane
  # rather than asserted here: USL's `build.gradle` declares `testImplementation junit` and
  # nothing else, and every `import` in these 18 files is `java.*` or `com.kotcrab.vis.usl.*`.
  # A port with nothing to resolve against is the one shape that needs neither key.
  sourceRoot = "../../../../../sge/original-src/vis-ui/usl/src/main/java"
}

output {
  portRoot  = "../../../../ported/sge-visui-usl"
  sourceSet = "main"
}

manifest {
  name = "sge-visui-usl"

  # THE SIBLING'S OTHER HALF. `sge-visui` claims `com.kotcrab.vis.ui`; this claims
  # `com.kotcrab.vis.usl`. Neither contains the other, and the organisation namespace
  # `com.kotcrab.vis` is claimed by NOBODY — which is the correct state for two independent
  # artifacts and is what keeps `SurfaceIntrusion` able to say something if either widens.
  governs = ["com.kotcrab.vis.usl"]

  # The destination namespace, chosen to sit beside the reference module's `sge.visui` exactly as
  # upstream's `com.kotcrab.vis.usl` sits beside `com.kotcrab.vis.ui`. `packageRenames` is DATA
  # rather than a surface entry (CLAUDE.md §4.56): the rename runs after every other phase,
  # because all of their policy is written in the upstream namespace.
  packageRenames { "com.kotcrab.vis.usl" = "sge.visui.usl" }

  # TWO PHASES, AND THE FIRST EMIT NAMED BOTH OF THEM. This list was EMPTY at first emit —
  # `VisUiPolicy`'s own rule for the sibling, "a wall measured under invented policy says nothing
  # about the engine, so every entry after these arrives with the number that justified it" — and
  # the wall it produced was 30 errors in exactly two families, each of which is one of these:
  surface = [
    # 24 of the 30: `E008 value foreach is not a member of java.util.ArrayList[…]`, in nine
    # members across `Parser`, `StyleMerger` and `IncludeLoader`. Java's enhanced `for` over an
    # `ArrayList`, which is what this library's whole shape is — a parser building lists of
    # identifiers and a merger folding them.
    #
    # WHAT THIS PORT IS ASKING OF THE RETYPING, and why it is not a free choice here: USL's output
    # is compared LINE BY LINE against an artifact upstream has already checked in, so any change
    # to ITERATION ORDER is a conformance failure rather than a caveat. That is safe for exactly
    # the reason it is worth stating — every collection in this library is an `ArrayList` indexed
    # by `get(i)` or walked in order, and the emitted surface preserves both. It is also precisely
    # the fact that would have been decided FOR this port by libGDX's shared surface had USL been a
    # scope edit rather than its own root (CLAUDE.md §1.5, and the conf header above).
    { transform = "collections" },
    # The other 6: `E052 Reassignment to val` at `usl`, `i`, `inheritString` and `includeName`. A
    # java parameter is an ordinary local (JLS 8.8.1) and may be reassigned; a scala one is a
    # `val`. This is noise4j's ONE phase for noise4j's one reason, arriving here at a
    # character-index scanner where reassigning the cursor parameter IS the loop.
    { transform = "mutable-params" },
  ]
}

# Apache-2.0, and this port DECLARES NO `notices` — which is a re-derived fact rather than an
# oversight (CLAUDE.md §4.57). All **18 of 18** sources carry the full "Licensed under the Apache
# License, Version 2.0" header, so the per-file trivia harvest (CLAUDE.md §4.58) plus the emitted banner
# meets the obligation BY CONSTRUCTION and `notices` is correctly the no-op its default is. That
# is the OPPOSITE of the sibling, where `layout/FlowGroup.java` carries no header and a second
# licence sits on a PNG; the lane re-derives 18/18 on every run, and the day one file loses its
# header this is the line that has to change.
provenance {
  upstreamName     = "USL"
  originalLicense  = "Apache-2.0"
  sourcePathPrefix = "vis-ui/usl/src/main/java"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale.
}

# A single source set compiled standalone by `scala-cli`: nothing else carries the support types,
# so this port vendors whatever the phases it ends up with require.
runtimeMode = "vendored"

nextStep = "just usl-measure"
