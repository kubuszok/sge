# -------------------------------------------------------------------------------------------
# simple-graphs' own JUnit suite (`src/test/java`) — 7 files, 16 `@Test` (a 17th, `GraphBuilderTest.testExample`, is commented out upstream), and the only
# behavioural evidence this port can have. CLAUDE.md §3 is explicit about the difference between
# this and a compile: four silent correctness defects in libGDX core all compiled cleanly, and not
# one of the Java forms in §4.4 moves a compile-error count.
#
# A DEPENDENT of `main.conf`: it resolves against `src/main/java`, never against the Scala that
# port emitted, so it INHERITS the base's rename and surface phases through `base` below rather
# than restating them (CLAUDE.md §1.5). `base` is not an include — it contributes the MANIFEST and
# nothing else; everything under `input`, `output`, `provenance` and `runtimeMode` here is a fact
# about THIS source set's build and is deliberately its own.
# -------------------------------------------------------------------------------------------

label = "sge-graphs-test"
base  = "main.conf"

input {
  sourceRoot = "../../../../../sge/original-src/simple-graphs/src/test/java"

  # JUnit must be on the FRONTEND's classpath. `import static org.junit.Assert.assertEquals` that
  # the frontend cannot resolve does not fail — it resolves WRONGLY, to an unqualified call on the
  # enclosing test class, and emits as `this.assertEquals(...)`. Recorded twice already (libGDX's
  # `org.junit.Assert.*`, Ashley's `org.mockito.Mockito.*`); this port would have made it three.
  #
  # The file is written by `SimpleGraphsClasspath`, which fetches exactly what `build.gradle`
  # DECLARES (junit:junit:4.12, not a current one — see that object for what guessing cost).
  classpathFile = "../../../../out/simplegraphs-test-classpath.txt"

  resolutionRoots = ["../../../../../sge/original-src/simple-graphs/src/main/java"]
}

output {
  portRoot  = "../../../../ported/sge-graphs"
  sourceSet = "test"
}

manifest {
  name    = "sge-graphs-test"
  surface = [ { transform = "test-framework" } ]
}

provenance {
  upstreamName     = "simple-graphs"
  originalLicense  = "MIT"
  sourcePathPrefix = "src/test/java"
}

# NOT `vendored`, unlike the main port: that source set is compiled beside this one and already
# carries the shims. Vendoring again would define every support type twice — which the JVM
# tolerates only while the copies agree, and the Scala.js/Native linkers reject.
runtimeMode = "dependency"

nextStep = "just sg-measure"
