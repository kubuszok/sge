# -------------------------------------------------------------------------------------------
# simple-graphs — `src/main/java`, 29 types, a dependency-free graph library.
#
# This is the corpus's ACCEPTANCE PROOF that a port can be configured from a `.conf` file, with
# each parameterised phase built from its config section by a factory discovered through
# `ServiceLoader` rather than the file being a second source of truth: the port that
# `just sg-measure` measures is driven from this file, and the lane's requirement is that every
# check count and every member digest is byte-identical to the hand-written Scala migration
# program it replaced. `SimpleGraphsMigrate` is now three lines that resolve this path and call
# `PortConfig.load`.
#
# Paths are relative to THIS FILE (see `balticporter.runner.PortConfig`), so the port directory is
# relocatable and no system property has to be set for it to resolve.
#
# WHY simple-graphs, and not libGDX, is the one converted: it is the port whose whole policy is
# data. libGDX and Ashley both pass Scala the config format deliberately cannot hold — a
# library-specific (CLAUDE.md §1(c)) rule and, in Ashley's case, method bodies keyed to a dropped
# type — and the honest way to run those from a conf is a factory each, in the porting repository.
# -------------------------------------------------------------------------------------------

label = "sge-graphs"

input {
  # A BASE port: nothing is merely resolved against, everything is converted.
  sourceRoot = "../../../../../sge/original-src/simple-graphs/src/main/java"
}

output {
  portRoot  = "../../../../ported/sge-graphs"
  sourceSet = "main"
}

# simple-graphs' policy. A BASE manifest — it has no bases of its own.
manifest {
  name    = "sge-graphs"
  governs = ["space.earlygrey.simplegraphs"]

  # `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must run
  # after every other phase, because all of their policy is written in the upstream namespace, and
  # `runsAfter` cannot state "after everything". `PortRun` appends it last and verifies it with
  # `PackageRenameTransform.check`. Writing `{ transform = "package-rename" }` above is refused by
  # name, and the refusal says this.
  #
  # The reference hand-port's target namespace. This is the first time the engine renames a real
  # library, so treat a surprise here as information rather than noise.
  packageRenames { "space.earlygrey.simplegraphs" = "sge.graphs" }

  surface = [
    { transform = "collections" },
    { transform = "mutable-params" },
  ]

  # PER-LOCATION REMEDY SELECTION. Each key names ONE member in the UPSTREAM
  # namespace and each value is a remedy the engine PUBLISHED; the run applies it, moves the row out
  # of the lane that counted it into `remediation(resolved)`, and writes a porter note beside the
  # emitted code saying which entry the port picked. An unknown id is refused at load, and a key that
  # binds and never fires is reported as a policy finding rather than silently doing nothing.
  #
  # These three are DELIBERATE, and each is a decision a human made by reading the java:
  resolutions {
    # ---- heap-pollution(Unacknowledged) -----------------------------------------------------
    # `public void addVertices(V... vertices) { for (V v : vertices) addVertex(v); }`.
    # The body reads each element AT `V` and hands it to `addVertex(V)`; it never stores the array,
    # never writes into it, and performs no cast — the standard criteria for the assertion javac
    # asks for. And java gave the author nowhere to put it: JLS 9.6.4.7 allows `@SafeVarargs` only
    # on a static, final or private method, and this is a public non-final instance method of a
    # public abstract class, so the acknowledgement is UNWRITEABLE upstream. The port is the first
    # place it can be stated, which is exactly what the remedy exists for.
    "space.earlygrey.simplegraphs.Graph#addVertices(V[])" = "acknowledge"

    # ---- overload-risk(BoxingPhaseSpan), pinned ---------------------------------------------
    # `public boolean remove(Object item) { return item != null && remove(indexOf(item)) != null; }`
    # beside `public T remove(int index)`. This is CLAUDE.md §4.4's `remove` shape asked of the
    # library's own declarations: `indexOf` returns `int`, so javac bound `remove(int)` in phase 1
    # while `remove(Object)` is applicable only after boxing. The two members do ENTIRELY different
    # things — one removes by value and returns a boolean, the other removes by index and returns
    # the element — so the port names javac's choice explicitly rather than leaving it to scala's
    # single-phase rule.
    "space.earlygrey.simplegraphs.Array#remove(Object)" = "ascribe-javac-choice"

    # ---- overload-risk(BoxingPhaseSpan), accepted -------------------------------------------
    # `removeEdge` holds TWO calls of the same shape — `getOutEdges().remove(edge)` and
    # `v.getInEdges().remove(edge)` — both on an `Array<Connection<V>>` whose `remove` overloads are
    # the pair above. Here the argument is a `Connection<V>`, which does not convert to `int` in
    # either language, so both compilers can only bind `remove(Object)` and the risk row is an
    # over-approximation: the candidate set spans a phase, the arguments never do. Read and accepted
    # rather than pinned — one key, both sites, since a remedy key broadcasts to every matching site.
    "space.earlygrey.simplegraphs.Node#removeEdge(Node)" = "accept-risk"
  }

  # The reference hand port for sge-graphs. The hand-written simple-graphs port lives in sge's
  # extension tree. Not inherited: comparing against a hand port is per-library policy, and empty
  # policy is a no-op.
  parity { roots = ["../../../../../sge/sge-extension/graphs/src/main/scala"] }
}

# Licence — a discrepancy worth recording. Upstream ships MIT (`LICENSE`: "MIT License, Copyright
# (c) 2020 earlygrey"). The reference hand-port's file headers say "Licensed under the ISC
# License". One of the two is wrong, and since a port is a derived work the upstream file is the
# authority — this port states MIT.
provenance {
  upstreamName     = "simple-graphs"
  originalLicense  = "MIT"
  sourcePathPrefix = "src/main/java"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale.
}

# A single source set compiled standalone by `scala-cli`: the support types the collections phase
# retypes onto ship beside the emitted code.
runtimeMode = "vendored"

nextStep = "scala-cli compile simplegraphs-core/src_managed/main/scala"
